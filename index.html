<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電話查詢系統</title>
    <style>
        /* 確保背景填滿整個視窗 */
        html, body {
            height: 100%; /* 確保背景高度覆蓋整個視窗 */
            margin: 0;
            padding: 0;
        }

        /* 背景圖片樣式 */
        body {
            background-image: url('517.jpg'); /* 替換為你的背景圖片路徑 */
            background-size: cover;          /* 確保圖片填滿頁面 */
            background-repeat: no-repeat;    /* 禁止圖片重複 */
            background-attachment: scroll;   /* 手機上使用 scroll，避免固定背景的問題 */
            background-position: center;     /* 圖片置中 */
            min-height: 100vh;               /* 確保背景高度至少為視窗高度 */
        }

        /* 內容容器 */
        .container {
            max-width: 700px;                /* 增加寬度 */
            margin: 30px auto 0;             /* 頂部保持適當的間距 */
            background-color: rgba(255, 255, 255, 0.9); /* 半透明白色背景 */
            padding: 25px;                   /* 增加內距 */
            border-radius: 12px;             /* 增加圓角 */
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2); /* 增強陰影效果 */
            text-align: center;
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 36px;                 /* 增加標題字體大小 */
            font-weight: bold;
            margin-bottom: 20px;             /* 增加標題與表單間的距離 */
        }

        .search-container {
            display: flex;
            flex-direction: row;
            margin-bottom: 15px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 15px;                   /* 增加輸入框的內距 */
            font-size: 18px;                 /* 增加輸入框字體大小 */
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        #searchButton {
            padding: 15px 20px;              /* 增加按鈕的內距 */
            font-size: 18px;                 /* 增加按鈕字體大小 */
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        #searchButton:hover {
            background-color: #0056b3;
        }

        .system-remark {
            font-size: 16px;                 /* 增加備註字體大小 */
            color: #888;
            text-align: center;
            margin-top: 15px;
        }

        .loading, .error, .no-results {
            text-align: center;
            color: #777;
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
        }

        .error {
            color: red;
            font-weight: bold;
        }

        .no-results {
            color: #555;
        }

        /* 手機版樣式調整 */
        @media (max-width: 768px) {
            .container {
                max-width: 90%;              /* 手機版最大寬度 */
                padding: 20px;
            }

            h1 {
                font-size: 28px;             /* 減小標題字體大小 */
            }

            #searchInput {
                padding: 12px;
                font-size: 16px;
            }

            #searchButton {
                padding: 10px 15px;
                font-size: 16px;
            }

            .system-remark {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>電話查詢系統</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="輸入關鍵字 (姓名、單位或地點)" />
            <button id="searchButton">查詢</button>
        </div>

        <p class="system-remark">此系統僅供方便查詢使用，不作即時更新連動</p>
        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainerDiv = document.getElementById('resultsContainer');

        // 載入資料
        let data = [];
        async function loadData() {
            try {
                const response = await fetch('data.json'); // 載入靜態 JSON 檔案
                if (!response.ok) {
                    throw new Error('無法載入資料');
                }
                data = await response.json();
            } catch (error) {
                console.error('載入資料時發生錯誤:', error);
                resultsContainerDiv.innerHTML = `<p class="error">載入資料失敗: ${error.message}</p>`;
            }
        }

        // 查詢資料
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            resultsContainerDiv.innerHTML = '<p class="loading">查詢中...</p>';

            if (!query) {
                resultsContainerDiv.innerHTML = '<p class="no-results">請輸入查詢關鍵字。</p>';
                return;
            }

            const filteredResults = data.filter(person =>
                (person.name && person.name.toLowerCase().includes(query)) ||
                (person.department && person.department.toLowerCase().includes(query)) ||
                (person.mobile_short_code && person.mobile_short_code.toLowerCase().includes(query)) ||
                (person.extension && person.extension.toLowerCase().includes(query))
            );

            resultsContainerDiv.innerHTML = '';

            if (filteredResults.length > 0) {
                const table = document.createElement('table');
                table.id = 'resultsTable';

                const thead = table.createTHead();
                const headerRow = thead.insertRow();
                const headers = ['姓名', '單位', '手機簡碼', '分機'];
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.textContent = headerText;
                    headerRow.appendChild(th);
                });

                const tbody = table.createTBody();
                filteredResults.forEach(person => {
                    const row = tbody.insertRow();
                    row.insertCell().textContent = person.name || '';
                    row.insertCell().textContent = person.department || '';
                    row.insertCell().textContent = person.mobile_short_code || '';
                    row.insertCell().textContent = person.extension || '';
                });

                resultsContainerDiv.appendChild(table);
            } else {
                resultsContainerDiv.innerHTML = '<p class="no-results">查無相關資料。</p>';
            }
        }

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                performSearch();
            }
        });

        // 初始化載入資料
        loadData();
    </script>
</body>
</html>
