<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電話查詢系統</title>
    <style>
        /* 確保背景填滿整個視窗 */
        html, body {
            height: 100%; /* 確保背景高度覆蓋整個視窗 */
            margin: 0;
            padding: 0;
        }

        /* 背景圖片樣式 */
        body {
            background-image: url('background.jpg'); /* 替換為你的背景圖片路徑 */
            background-size: cover;                /* 確保背景填滿頁面 */
            background-repeat: no-repeat;          /* 禁止圖片重複 */
            background-attachment: fixed;          /* 背景固定，適用桌面版 */
            background-position: center;           /* 圖片置中 */
            font-family: Arial, sans-serif;
            font-size: 16px;
        }

        /* 內容容器 */
        .container {
            max-width: 800px;                /* 寬度設置為 800px */
            margin: 20px auto;               /* 距離頂部 20px，置中對齊 */
            background-color: white;         /* 白色背景 */
            padding: 30px;                   /* 增加內距 */
            border-radius: 8px;              /* 增加圓角 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* 增強陰影效果 */
        }

        h1 {
            text-align: center;
            color: #333;
            font-size: 28px;                 /* 增加標題字體大小 */
            font-weight: bold;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            flex-direction: row;
            margin-bottom: 15px;
        }

        #searchInput {
            flex-grow: 1;
            padding: 12px;                   /* 增加輸入框的內距 */
            font-size: 16px;                 /* 增加輸入框字體大小 */
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #searchButton {
            padding: 12px 20px;              /* 增加按鈕的內距 */
            font-size: 16px;                 /* 增加按鈕字體大小 */
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
        }

        #searchButton:hover {
            background-color: #0056b3;
        }

        .system-remark {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .no-results {
            text-align: center;
            color: #555;
            margin-top: 20px;
            font-size: 16px;
        }

        .error {
            text-align: center;
            color: red;
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        /* 手機版樣式調整 */
        @media (max-width: 768px) {
            body {
                background-attachment: scroll; /* 手機版使用 scroll 背景 */
            }

            .container {
                max-width: 90%;              /* 手機版最大寬度 */
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }

            #searchInput {
                font-size: 14px;
            }

            #searchButton {
                font-size: 14px;
            }

            th, td {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>電話查詢系統</h1>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="輸入關鍵字 (姓名、單位或地點)" />
            <button id="searchButton">查詢</button>
        </div>

        <p class="system-remark">此系統僅供方便查詢使用，不作即時更新連動</p>
        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainerDiv = document.getElementById('resultsContainer');

        // 模擬的資料
        const data = [
            { name: "蔡珮容", department: "董事會秘書蔡珮容", mobile_short_code: "", extension: "1651" },
            { name: "蔡珮容", department: "", mobile_short_code: "", extension: "1651" },
            { name: "蔡珮容", department: "", mobile_short_code: "61651", extension: "" }
        ];

        // 查詢資料
        function performSearch() {
            const query = searchInput.value.trim().toLowerCase();
            resultsContainerDiv.innerHTML = '';

            if (!query) {
                resultsContainerDiv.innerHTML = '<p class="no-results">請輸入查詢關鍵字。</p>';
                return;
            }

            const filteredResults = data.filter(person =>
                (person.name && person.name.toLowerCase().includes(query)) ||
                (person.department && person.department.toLowerCase().includes(query)) ||
                (person.mobile_short_code && person.mobile_short_code.toLowerCase().includes(query)) ||
                (person.extension && person.extension.toLowerCase().includes(query))
            );

            if (filteredResults.length > 0) {
                const table = document.createElement('table');
                const thead = table.createTHead();
                const headerRow = thead.insertRow();
                const headers = ['姓名', '單位', '手機簡碼', '分機'];
                headers.forEach(headerText => {
                    const th = document.createElement('th');
                    th.textContent = headerText;
                    headerRow.appendChild(th);
                });

                const tbody = table.createTBody();
                filteredResults.forEach(person => {
                    const row = tbody.insertRow();
                    row.insertCell().textContent = person.name || '';
                    row.insertCell().textContent = person.department || '';
                    row.insertCell().textContent = person.mobile_short_code || '';
                    row.insertCell().textContent = person.extension || '';
                });

                resultsContainerDiv.appendChild(table);
            } else {
                resultsContainerDiv.innerHTML = '<p class="no-results">查無相關資料。</p>';
            }
        }

        searchButton.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', function (event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                performSearch();
            }
        });
    </script>
</body>
</html>
